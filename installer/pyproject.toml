[project]
name = "sdlc-installer"
version = "0.2.0"
description = "Controlador SSH dos instaladores nativos da infraestrutura SDLC"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "paramiko>=5.0.0,<6",
    "rich>=14.0,<15",
]

[project.scripts]
sdlc-installer = "sdlc_installer.cli:entrypoint"

[build-system]
requires = ["uv_build>=0.13.0,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.14,<0.16"]

[tool.uv]
required-version = ">=0.13.0,<0.14"
default-groups = ["dev"]

[tool.uv.build-backend]
source-include = ["uv.lock", ".python-version", "tests/**", "scripts/**", "config/**", "inventory.example.json", "validation.md"]
source-exclude = [".venv/**", ".state/**", "dist/**", "private/**", "inventory.json", "**/*.key", "**/*.pem"]

[tool.pytest.ini_options]
testpaths = ["tests", "../tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 110
extend-exclude = ["src/sdlc_installer/resources/remote.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
